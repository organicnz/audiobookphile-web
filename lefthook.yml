pre-commit:
  parallel: true
  commands:
    lint-and-format:
      glob: "*.{js,jsx,ts,tsx}"
      stage_fixed: true
      run: ./scripts/pre-commit.sh {staged_files}
    format-other:
      glob: "*.{json,css,md}"
      stage_fixed: true
      run: ./scripts/format-other.sh {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: ./scripts/commit-msg.sh {1}

pre-push:
  parallel: false
  commands:
    typecheck-and-test:
      run: bun run typecheck && bun test src/__tests__
