pre-commit:
  parallel: true
  commands:
    lint-and-format:
      glob: '*.{js,jsx,ts,tsx,json,yml}'
      stage_fixed: true
      run: ./scripts/pre-commit.sh {staged_files}
    format-other:
      glob: '*.{css,md}'
      stage_fixed: true
      run: ./scripts/format-other.sh {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: ./scripts/commit-msg.sh {1}

pre-push:
  parallel: false
  jobs:
    - name: delivery-gate
      run: ./scripts/pre-push-gate.sh

post-merge:
  commands:
    bun-install:
      glob: 'package.json'
      run: bun install

post-checkout:
  commands:
    bun-install:
      glob: 'package.json'
      run: bun install
