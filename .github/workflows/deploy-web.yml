name: Deploy Next.js Web App (Vercel Production)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Web Build & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        id: deps
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Web Build & Linting" deps \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|audit:Security Audit|typecheck:Typecheck|lint:Lint|build:Build Next.js Bundle" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }}"
          bun install

      - name: Security Audit
        id: audit
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Web Build & Linting" audit \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|audit:Security Audit|typecheck:Typecheck|lint:Lint|build:Build Next.js Bundle" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }}"
          ./scripts/security-audit.sh

      - name: Typecheck
        id: typecheck
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Web Build & Linting" typecheck \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|audit:Security Audit|typecheck:Typecheck|lint:Lint|build:Build Next.js Bundle" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};audit=${{ steps.audit.outcome }}"
          bun run typecheck

      - name: Lint
        id: lint
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Web Build & Linting" lint \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|audit:Security Audit|typecheck:Typecheck|lint:Lint|build:Build Next.js Bundle" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};audit=${{ steps.audit.outcome }};typecheck=${{ steps.typecheck.outcome }}"
          bun run lint

      - name: Build Next.js Bundle
        id: build
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Web Build & Linting" build \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|audit:Security Audit|typecheck:Typecheck|lint:Lint|build:Build Next.js Bundle" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};audit=${{ steps.audit.outcome }};typecheck=${{ steps.typecheck.outcome }};lint=${{ steps.lint.outcome }}"
          bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        id: deps
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Lighthouse Performance Audit" deps \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|audit:Run Lighthouse CI" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }}"
          bun install --frozen-lockfile

      - name: Build Next.js Bundle
        id: build
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Lighthouse Performance Audit" build \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|audit:Run Lighthouse CI" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }}"
          bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Run Lighthouse CI
        id: audit
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Lighthouse Performance Audit" audit \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|audit:Run Lighthouse CI" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};build=${{ steps.build.outcome }}"
          bunx lhci autorun
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  size-limit:
    name: Bundle Size Limit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        id: deps
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Bundle Size Limit" deps \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|check:Check Size Limit" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }}"
          bun install --frozen-lockfile

      - name: Build Next.js Bundle
        id: build
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Bundle Size Limit" build \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|check:Check Size Limit" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }}"
          bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Check Size Limit
        id: check
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Bundle Size Limit" check \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|check:Check Size Limit" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};build=${{ steps.build.outcome }}"
          bunx size-limit

  deploy:
    name: Deploy to Vercel (Preview Build)
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Check Vercel Token & Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Vercel (Preview Build)" deploy \
            "checkout:Checkout Repository|bun:Setup Bun|deploy:Check Vercel Token & Deploy" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }}"
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is unset; relying on native Vercel Git Integration deployment."
            exit 0
          fi
          bun add -g vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN | tail -1)
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E Smoke (Playwright)
    needs: deploy
    if: needs.deploy.outputs.deployment_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        id: deps
        run: |
          . .github/scripts/step-tree.sh
          step_tree "E2E Smoke (Playwright)" deps \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|browsers:Install Playwright Chromium|e2e:Run E2E Smoke Against Preview" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }}"
          bun install

      - name: Install Playwright Chromium
        id: browsers
        run: |
          . .github/scripts/step-tree.sh
          step_tree "E2E Smoke (Playwright)" browsers \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|browsers:Install Playwright Chromium|e2e:Run E2E Smoke Against Preview" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }}"
          bunx playwright install --with-deps chromium

      - name: Run E2E Smoke Against Preview
        id: e2e
        run: |
          . .github/scripts/step-tree.sh
          step_tree "E2E Smoke (Playwright)" e2e \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|browsers:Install Playwright Chromium|e2e:Run E2E Smoke Against Preview" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};browsers=${{ steps.browsers.outcome }}"
          bun run test
        env:
          NEXT_PUBLIC_SITE_URL: ${{ needs.deploy.outputs.deployment_url }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_MEMBER_EMAIL: ${{ secrets.PLAYWRIGHT_MEMBER_EMAIL }}
          PLAYWRIGHT_MEMBER_PASSWORD: ${{ secrets.PLAYWRIGHT_MEMBER_PASSWORD }}
        timeout-minutes: 15

  promote:
    name: Promote Preview to Production
    needs: e2e
    if: needs.deploy.outputs.deployment_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Promote Deployment
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Promote Preview to Production" promote \
            "bun:Setup Bun|promote:Promote Deployment"
          bun add -g vercel@latest
          vercel promote ${{ needs.deploy.outputs.deployment_url }} --yes --token=$VERCEL_TOKEN
