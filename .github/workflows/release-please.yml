name: Release Please

on:
  # Parked: run manually from the Actions tab when needed.
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}
